name: Experimental native IRIX bootstrap

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Last fail-fast bootstrap stage to attempt
        required: true
        default: ghc-configure
        type: choice
        options:
          - environment
          - toolchain
          - ghc-configure

permissions:
  contents: read

jobs:
  validate:
    name: Validate experimental build scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate scripts and target matrix
        run: ./builders/irix/test-scripts

  irix-bootstrap:
    name: IRIX 6.5.22 ${{ inputs.stage }} experiment
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Run requested stage in the pinned IRIX worker
        timeout-minutes: 345
        env:
          IRIX_EMULATOR_ARTIFACT_DIR: artifacts/irix-${{ github.run_id }}-${{ github.run_attempt }}
          IRIX_EMULATOR_JOB_TIMEOUT: 18000
        run: ./builders/irix/run-emulator '${{ inputs.stage }}'

      - name: Upload experiment evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: irix-bootstrap-${{ inputs.stage }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/irix-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
