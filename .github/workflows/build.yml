name: Build ShellCheck

# Build reviewable artifacts for every branch, tag, and pull request.
on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to rebuild and deploy
        required: false
        type: string

jobs:
  package_source:
    name: Package Source Code
    runs-on: ubuntu-latest
    steps:
      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-mark manual ghc # Don't bother installing ghc just to tar up source
          sudo apt-get install cabal-install

      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify manual release source
        if: inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: test "$(git describe --exact-match --tags)" = "$RELEASE_TAG"

      - name: Deduce tags
        run: |
          mkdir source
          echo "latest" > source/tags
          if tag=$(git describe --exact-match --tags)
          then
            echo "stable" >> source/tags
            echo "$tag" >> source/tags
          fi
          cat source/tags

      - name: Package Source
        run: |
          # Embed the exact git description even for stable fork tags so
          # --version retains suffixes such as "-irix.4" in every binary.
          ./setgitversion
          cabal sdist
          mv dist-newstyle/sdist/*.tar.gz source/source.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: source
          path: source/

  run_tests:
    name: Run tests (GHC ${{ matrix.ghc }})
    needs: package_source
    runs-on: ubuntu-latest
    strategy:
      matrix:
        ghc: ['8.0', '8.10', '9.0.1', '9.4.7', '9.6.6', 'latest']
        include:
          - ghc: 'latest'
            cabal_flags: '--allow-newer'
      # If one version fails, we still want the status of the others
      fail-fast: false
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: source
          path: source/

      - name: Setup Haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}

      - name: Unpack source
        run: |
          cd source
          tar xvf source.tar.gz --strip-components=1

      - name: Build and run tests
        run: |
          cd source
          cabal test ${{ matrix.cabal_flags }}

  build_source:
    name: Build
    needs: package_source
    strategy:
      matrix:
        build: [linux.x86_64, linux.aarch64, linux.armv6hf, linux.riscv64, darwin.x86_64, darwin.aarch64, windows.x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          name: source
          path: source/

      - name: Build source
        run: |
          mkdir -p bin
          mkdir -p bin/${{matrix.build}}
          ( cd bin && ../builders/run_builder ../source/source.tar.gz ../builders/${{matrix.build}} )

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{matrix.build}}.bin
          path: bin/

  package_binary:
    name: Package Binaries
    needs: build_source
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: List files for debugging
        run: find .

      - name: Work around GitHub permissions bug
        run: chmod +x *.bin/*/shellcheck*

      - name: Package binaries
        run: |
          export TAGS="$(cat source/tags)"
          mkdir -p deploy
          cp -r *.bin/* deploy
          cd deploy
          ../.prepare_deploy
          rm -rf */ README* LICENSE*

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: deploy
          path: deploy/

  deploy:
    if: >-
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))) ||
      (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    name: Deploy binaries
    needs: package_binary
    runs-on: ubuntu-latest
    environment: Deploy
    permissions:
      contents: write
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      DOCKER_EMAIL: ${{ secrets.DOCKER_EMAIL }}
      DOCKER_BASE: ${{ secrets.DOCKER_USERNAME }}/shellcheck
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download artifacts (source)
        uses: actions/download-artifact@v8
        with:
          name: source
          path: source/

      - name: Download artifacts (binaries)
        uses: actions/download-artifact@v8
        with:
          name: deploy
          path: deploy/

      - name: Upload to GitHub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SOURCE_TAG: ${{ inputs.release_tag }}
        run: |
          export TAGS="$(cat source/tags)"
          ./.github_deploy

      - name: Waiting for GitHub to replicate uploaded releases
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        run: |
          sleep 300

      - name: Upload to Docker Hub
        if: env.DOCKER_USERNAME != '' && env.DOCKER_PASSWORD != ''
        run: |
          export TAGS="$(cat source/tags)"
          export RELEASE_URL_BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/"
          ( source ./.multi_arch_docker && set -eux && multi_arch_docker::main )

      - name: Report skipped Docker Hub deployment
        if: env.DOCKER_USERNAME == '' || env.DOCKER_PASSWORD == ''
        run: echo "::notice::Skipping Docker Hub deployment because credentials are not configured."
